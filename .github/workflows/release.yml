name: Release DMG

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run unit tests
        run: swift test

      - name: Build universal app and DMG
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          VERSION="$VERSION" UNIVERSAL=1 ./scripts/build-app.sh --dmg

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/AIQuotaBar-*.dmg
          generate_release_notes: true
